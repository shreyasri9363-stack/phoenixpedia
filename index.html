<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhoenixPedia — Public Profile Encyclopedia</title>
<link rel="icon" type="image/png" href="plogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,560;9..144,650&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EC;
  --paper-deep:#F3EDDF;
  --ink:#201D17;
  --ink-soft:#635C4C;
  --ink-faint:#9A927D;
  --line:#E4DBC5;
  --line-strong:#D2C7A9;
  --card:#FFFEFA;
  --ember:#BE7F27;
  --ember-deep:#8F5D16;
  --ember-soft:#F3E1BE;
  --pine:#20493F;
  --pine-soft:#DCE9E3;
  --azure:#2B5A88;
  --azure-soft:#DCE7F1;
  --gold:#A6791C;
  --gold-soft:#F0E0B0;
  --dusk:#17150F;
  --dusk-card:#211E17;
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:20px;
  --shadow-card:0 1px 2px rgba(32,29,23,.06), 0 10px 24px -14px rgba(32,29,23,.18);
  --shadow-pop:0 20px 60px -20px rgba(32,29,23,.35);
  --maxw:1180px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',serif;
  font-weight:560;
  letter-spacing:-.01em;
  margin:0 0 .4em;
  color:var(--ink);
}
p{margin:0 0 1em;color:var(--ink-soft);}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ember-deep);outline-offset:2px;}
.container{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
@media(max-width:720px){.container{padding:0 18px;}}

/* ---------- NAV ---------- */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(250,246,236,.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px;}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:22px;font-weight:650;}
.logo-mark{width:34px;height:34px;flex:none;border-radius:50%}
.nav-links{display:flex;align-items:center;gap:30px;}
.nav-links a{font-size:14.5px;color:var(--ink-soft);font-weight:500;padding:6px 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.nav-links a:hover,.nav-links a.active{color:var(--ink);border-color:var(--ember);}
.nav-actions{display:flex;align-items:center;gap:12px;}
.nav-burger{display:none;background:none;border:1px solid var(--line-strong);border-radius:var(--radius-s);width:40px;height:40px;align-items:center;justify-content:center;}
@media(max-width:860px){
  .nav-links{position:fixed;top:72px;left:0;right:0;background:var(--paper);flex-direction:column;align-items:stretch;gap:0;padding:8px 18px 18px;border-bottom:1px solid var(--line);transform:translateY(-8px);opacity:0;pointer-events:none;transition:.18s;}
  .nav-links.open{transform:translateY(0);opacity:1;pointer-events:auto;}
  .nav-links a{padding:12px 0;border-bottom:1px solid var(--line);}
  .nav-burger{display:flex;}
  .nav-actions .btn{display:none;}
  .nav-actions{gap:8px;}
}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:999px;border:1px solid transparent;
  font-size:14.5px;font-weight:600;line-height:1;
  transition:transform .12s ease,box-shadow .12s ease,background .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(180deg,#CE9440,var(--ember-deep));color:#fff;box-shadow:0 8px 18px -8px rgba(143,93,22,.55);}
.btn-primary:hover{box-shadow:0 12px 22px -8px rgba(143,93,22,.65);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:#3a352a;}
.btn-outline{background:transparent;border-color:var(--line-strong);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:8px 16px;font-size:13.5px;}
.btn-block{width:100%;}
.btn-danger{background:transparent;border-color:#D9BBB2;color:#9A3B24;}
.btn-danger:hover{background:#FBEDE8;}
.btn[disabled]{opacity:.5;pointer-events:none;}

/* ---------- FORMS ---------- */
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px;}
.field .hint{font-size:12.5px;color:var(--ink-faint);margin-top:5px;}
.input,.textarea,select.input{
  width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-s);
  background:#fff;font-family:inherit;font-size:14.5px;color:var(--ink);
}
.input:focus,.textarea:focus{border-color:var(--ember-deep);}
.textarea{resize:vertical;min-height:90px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.two-col{grid-template-columns:1fr;}}
.rt-toolbar{display:flex;gap:4px;border:1px solid var(--line-strong);border-bottom:none;border-radius:var(--radius-s) var(--radius-s) 0 0;padding:6px;background:var(--paper-deep);}
.rt-toolbar button{width:32px;height:32px;border:none;background:#fff;border-radius:6px;font-weight:700;font-size:13px;color:var(--ink-soft);}
.rt-toolbar button:hover{background:var(--ember-soft);color:var(--ember-deep);}
.rt-editor{min-height:180px;border:1px solid var(--line-strong);border-radius:0 0 var(--radius-s) var(--radius-s);padding:16px;background:#fff;font-size:15px;line-height:1.7;}
.rt-editor:focus{outline:none;border-color:var(--ember-deep);}
.rt-editor ul{padding-left:20px;}

/* ---------- CARDS / LAYOUT ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-l);}
.section{padding:64px 0;}
.section-tight{padding:36px 0;}
.eyebrow{font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-bottom:10px;}

/* ---------- HOME HERO ---------- */
.hero{padding:76px 0 40px;text-align:center;position:relative;overflow:hidden;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:12.5px;color:var(--ink-soft);margin-bottom:26px;background:#fff;}
.hero h1{font-size:clamp(34px,5.6vw,64px);max-width:820px;margin:0 auto 18px;line-height:1.06;}
.hero h1 em{font-style:italic;color:var(--ember-deep);}
.hero p.lead{max-width:560px;margin:0 auto 34px;font-size:17px;}
.search-shell{max-width:640px;margin:0 auto 30px;}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line-strong);border-radius:999px;padding:8px 8px 8px 22px;box-shadow:var(--shadow-card);}
.search-box input{flex:1;border:none;outline:none;font-size:15.5px;font-family:inherit;background:transparent;padding:10px 0;}
.search-box button{border:none;background:var(--ink);color:#fff;border-radius:999px;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.hero-stats{display:flex;gap:44px;justify-content:center;margin-top:52px;flex-wrap:wrap;}
.hero-stats .stat-num{font-family:'Fraunces',serif;font-size:30px;font-weight:560;}
.hero-stats .stat-lbl{font-size:12.5px;color:var(--ink-faint);}

/* ---------- PROFILE GRID / CARD ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
@media(max-width:980px){.grid-cards{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.grid-cards{grid-template-columns:1fr;}}
.profile-card{border:1px solid var(--line);border-radius:var(--radius-l);background:var(--card);padding:20px;transition:box-shadow .18s,transform .18s,border-color .18s;position:relative;}
.profile-card:hover{box-shadow:var(--shadow-card);transform:translateY(-3px);border-color:var(--line-strong);}
.pc-top{display:flex;gap:14px;margin-bottom:16px;}
.pc-photo{width:74px;height:74px;border-radius:14px;overflow:hidden;flex:none;background:var(--paper-deep);border:1px solid var(--line);}
.pc-photo img{width:100%;height:100%;object-fit:cover;}
.pc-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pc-name{font-family:'Fraunces',serif;font-weight:560;font-size:15.5px;letter-spacing:.01em;text-transform:uppercase;}
.pc-profession{font-style:italic;color:var(--ink-soft);font-size:13.5px;margin-top:3px;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;flex:none;}
.badge svg{width:100%;height:100%;}
.badge-normal{color:var(--pine);}
.badge-blue{color:var(--azure);}
.badge-vip{color:var(--gold);}
.pc-meta{display:flex;align-items:center;gap:16px;color:var(--ink-faint);font-size:12.5px;margin:14px 0 16px;padding-top:14px;border-top:1px solid var(--line);}
.pc-meta span{display:flex;align-items:center;gap:5px;}
.pc-bottom{display:flex;align-items:center;justify-content:space-between;}
.pc-date{font-size:12px;color:var(--ink-faint);}
.readmore{font-size:13.5px;font-weight:600;color:var(--ember-deep);border-bottom:1.5px solid var(--ember);padding-bottom:1px;}
.readmore:hover{color:var(--ink);border-color:var(--ink);}

/* ---------- SECTION HEAD ---------- */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:34px;gap:20px;flex-wrap:wrap;}
.section-head h2{font-size:30px;margin:0;}
.empty-note{text-align:center;padding:60px 20px;color:var(--ink-faint);border:1px dashed var(--line-strong);border-radius:var(--radius-l);}

/* ---------- FOOTER ---------- */
.footer{background:var(--dusk);color:#DCD6C6;padding:56px 0 26px;margin-top:80px;}
.footer .container{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;}
.footer h4{color:#fff;font-size:16px;}
.footer a{color:#B7AF9B;font-size:14px;}
.footer-col a{display:block;margin-bottom:9px;}
.footer-bottom{border-top:1px solid #33301F;margin-top:40px;padding-top:20px;text-align:center;font-size:12.5px;color:#8A836E;}
.footer-brand{max-width:280px;}
.footer-brand p{color:#9C947E;font-size:13.5px;}

/* ---------- AUTH PAGES ---------- */
.auth-wrap{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:60px 20px;}
.auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-l);padding:40px 36px;box-shadow:var(--shadow-card);}
.auth-card h2{text-align:center;font-size:26px;}
.auth-sub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:30px;}
.auth-switch{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:20px;}
.auth-switch a{color:var(--ember-deep);font-weight:600;}
.error-box{background:#FBEDE8;border:1px solid #E7C1B3;color:#9A3B24;font-size:13.5px;padding:10px 14px;border-radius:8px;margin-bottom:16px;}
.demo-hint{margin-top:18px;padding:10px 14px;background:var(--paper-deep);border-radius:8px;font-size:12px;color:var(--ink-faint);text-align:center;}

/* ---------- DASHBOARD ---------- */
.dash-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:36px;}
.dash-welcome{font-size:13.5px;color:var(--ink-faint);}
.dash-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}
.dash-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-l);padding:28px;}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;}
.status-draft{background:var(--paper-deep);color:var(--ink-soft);}
.status-live{background:var(--pine-soft);color:var(--pine);}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
@media(max-width:520px){.action-grid{grid-template-columns:1fr;}}
.action-btn{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-m);background:#fff;text-align:left;transition:.15s;}
.action-btn:hover{border-color:var(--ember);background:var(--ember-soft);}
.action-btn .ic{width:34px;height:34px;border-radius:9px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ember-deep);}
.action-btn .txt strong{display:block;font-size:14px;}
.action-btn .txt span{font-size:12px;color:var(--ink-faint);}
.action-btn[disabled]{opacity:.45;pointer-events:none;}
.mini-stat-row{display:flex;gap:14px;margin-top:18px;}
.mini-stat{flex:1;background:var(--paper-deep);border-radius:var(--radius-m);padding:14px;text-align:center;}
.mini-stat b{display:block;font-family:'Fraunces',serif;font-size:22px;}
.mini-stat span{font-size:11.5px;color:var(--ink-faint);}

/* ---------- WIZARD ---------- */
.wizard-shell{max-width:760px;margin:0 auto;}
.stepper{display:flex;gap:6px;margin-bottom:40px;}
.step-dot{flex:1;height:4px;background:var(--line);border-radius:3px;position:relative;overflow:hidden;}
.step-dot.done,.step-dot.active{background:var(--ember);}
.step-label{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-bottom:6px;}
.wizard-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-l);padding:38px;}
@media(max-width:600px){.wizard-card{padding:24px;}}
.wizard-card h3{font-size:22px;}
.wizard-nav{display:flex;justify-content:space-between;margin-top:32px;padding-top:24px;border-top:1px solid var(--line);}
.repeat-row{border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-bottom:14px;position:relative;background:var(--paper-deep);}
.repeat-row .rm-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--ink-faint);width:26px;height:26px;}
.repeat-row .rm-btn:hover{color:#9A3B24;}
.add-row-btn{border:1.5px dashed var(--line-strong);background:transparent;border-radius:var(--radius-m);padding:12px;width:100%;color:var(--ink-soft);font-size:13.5px;font-weight:600;}
.add-row-btn:hover{border-color:var(--ember);color:var(--ember-deep);}
.photo-upload{display:flex;align-items:center;gap:18px;}
.photo-preview{width:88px;height:88px;border-radius:16px;overflow:hidden;background:var(--paper-deep);border:1px solid var(--line);flex:none;}
.photo-preview img{width:100%;height:100%;object-fit:cover;}

/* ---------- PROFILE PAGE ---------- */
.profile-hero{background:var(--dusk);color:#F0EBDC;padding:64px 0 90px;position:relative;overflow:hidden;}
.profile-hero-inner{display:flex;gap:34px;align-items:center;flex-wrap:wrap;}
.profile-photo-lg{width:150px;height:150px;border-radius:24px;overflow:hidden;flex:none;border:3px solid #3a3627;background:#292414;}
.profile-photo-lg img{width:100%;height:100%;object-fit:cover;}
.profile-hero h1{color:#fff;font-size:clamp(28px,4vw,42px);text-transform:uppercase;letter-spacing:.01em;margin-bottom:8px;}
.profile-hero .prof{font-style:italic;color:#C9C1A8;font-size:17px;margin-bottom:14px;}
.hero-tags{display:flex;gap:18px;flex-wrap:wrap;color:#9F9781;font-size:13px;}
.hero-tags span{display:flex;align-items:center;gap:6px;}
.profile-body{max-width:760px;margin:-46px auto 0;background:var(--card);border-radius:var(--radius-l);border:1px solid var(--line);padding:44px;box-shadow:var(--shadow-pop);position:relative;}
@media(max-width:640px){.profile-body{padding:26px;margin-top:-30px;}}
.like-row{display:flex;gap:12px;margin-bottom:34px;}
.like-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:9px 18px;background:#fff;font-size:13.5px;font-weight:600;}
.like-btn.liked{background:#FBE9E4;border-color:#E6B6A6;color:#9A3B24;}
.share-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.share-btn:hover{border-color:var(--ink);color:var(--ink);}
.prose{font-size:16px;line-height:1.8;color:var(--ink);}
.block-title{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ember-deep);margin:38px 0 16px;}
.timeline{border-left:2px solid var(--line-strong);padding-left:22px;margin-left:6px;}
.timeline-item{position:relative;margin-bottom:22px;}
.timeline-item::before{content:'';position:absolute;left:-28px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ember);border:2px solid var(--paper);}
.timeline-item .ti-title{font-weight:650;font-family:'Fraunces',serif;font-size:15.5px;}
.timeline-item .ti-meta{font-size:12.5px;color:var(--ink-faint);margin-bottom:4px;}
.timeline-item .ti-desc{font-size:14px;color:var(--ink-soft);}
.simple-list{list-style:none;padding:0;margin:0;}
.simple-list li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.simple-list li:last-child{border-bottom:none;}
.social-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.social-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;background:#fff;}
.social-chip:hover{border-color:var(--ink);}

/* ---------- VERIFY / PRICING ---------- */
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:900px){.plans-grid{grid-template-columns:1fr;}}
.plan-card{border:1.5px solid var(--line);border-radius:var(--radius-l);padding:30px;background:var(--card);position:relative;display:flex;flex-direction:column;}
.plan-card.featured{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.plan-tag{position:absolute;top:-13px;left:26px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.02em;}
.plan-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.plan-price{font-family:'Fraunces',serif;font-size:34px;margin:6px 0 18px;}
.plan-price span{font-size:14px;color:var(--ink-faint);font-family:'Inter',sans-serif;font-weight:500;}
.plan-features{list-style:none;padding:0;margin:0 0 26px;flex:1;}
.plan-features li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-soft);margin-bottom:11px;}
.plan-features li svg{flex:none;margin-top:2px;color:var(--pine);}

.pay-screen{max-width:460px;margin:0 auto;text-align:center;padding:70px 20px;}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ember);margin:0 auto 26px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.success-screen{max-width:520px;margin:0 auto;text-align:center;padding:60px 20px;position:relative;}
.success-icon{width:88px;height:88px;border-radius:50%;background:var(--pine-soft);color:var(--pine);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;animation:pop .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.12);}100%{transform:scale(1);}}
.confetti-piece{position:absolute;top:-10px;width:8px;height:14px;opacity:0;animation:fall 2.6s ease-in forwards;}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(420px) rotate(400deg);}}

/* ---------- CONTACT / ABOUT ---------- */
.about-hero{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap;margin-bottom:50px;}
.about-photo{width:220px;height:220px;border-radius:var(--radius-l);overflow:hidden;flex:none;border:1px solid var(--line);box-shadow:var(--shadow-card);}
.about-photo img{width:100%;height:100%;object-fit:cover;}
.about-facts{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 22px;}
.about-facts .f{font-size:13px;color:var(--ink-soft);display:flex;gap:7px;align-items:center;}
.about-facts b{color:var(--ink);}
.edit-toggle{position:sticky;top:88px;z-index:10;display:flex;justify-content:flex-end;margin-bottom:20px;}
.editable-note{background:var(--ember-soft);border:1px solid var(--ember);color:var(--ember-deep);font-size:12.5px;padding:9px 14px;border-radius:8px;margin-bottom:20px;}
.two-col-section{display:grid;grid-template-columns:1fr 1fr;gap:44px;}
@media(max-width:800px){.two-col-section{grid-template-columns:1fr;}}

   viewing this artifact. Payment is a placeholder simulation —

const DB = { users: [], profiles: [], founder: null, session: null };

/* ---------------- storage helpers ---------------- */
async function sGet(key, shared){
  try{
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : null;
  }catch(e){
    return null;
  }
}

async function sSet(key, value, shared){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('storage set failed', e);
    return false;
  }
}
async function saveUsers(){ await sSet('pp_users', DB.users, true); }
async function saveProfiles(){ await sSet('pp_profiles', DB.profiles, true); }
async function saveFounder(){ await sSet('pp_founder', DB.founder, true); }
async function saveSession(){ await sSet('pp_session', DB.session, false); }

function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function fmtNum(n){ n=n||0; if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'k'; return String(n); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}

async function resizeImage(file, maxSize=420, quality=.78){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width,h=img.height;
        if(w>h){ if(w>maxSize){h=h*(maxSize/w);w=maxSize;} } else { if(h>maxSize){w=w*(maxSize/h);h=maxSize;} }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function avatarSVG(name){

  let h=0; for(const c of (name||'x')) h=(h*31+c.charCodeAt(0))%palettes.length;
  const [c1,c2]=palettes[h];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c1}'/><stop offset='1' stop-color='${c2}'/></linearGradient></defs><rect width='200' height='200' fill='url(#g)'/><text x='100' y='118' font-family='Georgia,serif' font-size='72' fill='white' text-anchor='middle' opacity='.95'>${initials(name)}</text></svg>`;

/* ================= INIT ================= */async function initDB(){
  DB.users = await sGet('pp_users', true) || [];
  DB.profiles = await sGet('pp_profiles', true) || [];
  DB.founder = await sGet('pp_founder', true);
  let dirty = false;
  if(!DB.founder){ DB.founder = seedFounder(); dirty = true; await saveFounder(); }
  if(!DB.users.find(u=>u.isFounder)){ DB.users.unshift(seedFounderUser()); await saveUsers(); }
  if(DB.profiles.length===0){ DB.profiles = seedDemoProfiles(); await saveProfiles(); }
  DB.session = await sGet('pp_session', false);
  if(DB.session && !DB.users.find(u=>u.id===DB.session.userId)) DB.session = null;
}

/* ================= ROUTER ================= */
const routes = {};
window.addEventListener('hashchange', ()=>render());
async function boot(){
  await initDB();
  if(!location.hash) location.hash = '#/';
  render();
}
function parseHash(){
  const h = location.hash.replace(/^#\//,'');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const query = {};
  if(qs) qs.split('&').forEach(kv=>{ const [k,v]=kv.split('='); query[k]=decodeURIComponent(v||''); });
  return { parts, query };
}
function requireAuth(){
  if(!currentUser()){ toast('Please log in to continue.'); go('#/login'); return false; }
  return true;
}

function render(){
  const { parts, query } = parseHash();
  const root = parts[0] || '';
  const app = document.getElementById('app');
  let html = '';
  window.scrollTo({top:0,behavior:'instant'});

  if(root===''){ html = pageHome(query); }
  else if(root==='about'){ html = pageAbout(); }
  else if(root==='contact'){ html = pageContact(); }
  else if(root==='login'){ html = pageLogin(); }
  else if(root==='register'){ html = pageRegister(); }
  else if(root==='dashboard'){ if(!requireAuth()) return; html = pageDashboard(); }
  else if(root==='wizard'){ if(!requireAuth()) return; html = pageWizard(query); }
  else if(root==='profile' && parts[1]){ html = pageProfile(parts[1]); }
  else if(root==='verify'){ if(!requireAuth()) return; html = pageVerify(query); }
  else { html = page404(); }

  app.innerHTML = `${navBar(root)}<main class="page-fade">${html}</main>${footerHTML()}`;
  bindGlobal();
  afterRender(root, query, parts);
}

/* ================= WIZARD ================= */
const WIZ_STEPS = ['Basic info','Biography','Education','Career','Achievements','Awards & records','Social links','Preview'];
let wizardState = null;
function blankWizardState(){
  return { fullName:'', photo:'', birthdate:'', profession:'', bio:'', education:[], career:[], achievements:[], awards:[], records:[],
    social:{instagram:'',facebook:'',twitter:'',whatsapp:'',email:''} };
}
function pageWizard(query){
  const step = Math.min(Math.max(parseInt(query.step||'1',10),1), WIZ_STEPS.length);
  const u = currentUser();
  if(!wizardState){
    const existing = userProfile(u.id);
    wizardState = existing ? JSON.parse(JSON.stringify(existing)) : blankWizardState();
  }
  const dots = WIZ_STEPS.map((_,i)=>`<div class="step-dot ${i+1<step?'done':i+1===step?'active':''}"></div>`).join('');
  return `
  <section class="section">
    <div class="container wizard-shell">
      <div class="step-label">Step ${step} of ${WIZ_STEPS.length} — ${WIZ_STEPS[step-1]}</div>
      <div class="stepper">${dots}</div>
      <div class="wizard-card">
        <div id="wizStepBody">${wizardStepBody(step)}</div>
        <div class="wizard-nav">
          <button class="btn btn-outline" id="wizBack" ${step===1?'disabled':''}>Back</button>
          <div style="display:flex;gap:10px;">
            ${step===WIZ_STEPS.length? `<button class="btn btn-primary" id="wizSave">${ICON.check} Save profile</button>` : `<button class="btn btn-primary" id="wizNext">Continue ${ICON.arrowR}</button>`}
          </div>
        </div>
      </div>
    </div>
  </section>`;
}
function repeaterRow(fields, values, idx, prefix){
  return `<div class="repeat-row" data-idx="${idx}">

    ${fields.map(f=>`<div class="field" style="margin-bottom:10px;"><label>${f.label}</label>
      ${f.type==='textarea'? `<textarea class="textarea" data-field="${prefix}.${idx}.${f.key}" rows="2">${esc(values[f.key]||'')}</textarea>`
      : `<input class="input" data-field="${prefix}.${idx}.${f.key}" value="${esc(values[f.key]||'')}" placeholder="${f.ph||''}">`}
    </div>`).join('')}
  </div>`;
}

function collectStepIntoState(step){
  const w = wizardState;
  if(step===1){
    w.fullName = document.getElementById('f_fullName').value.trim();
    w.birthdate = document.getElementById('f_birthdate').value;
    w.profession = document.getElementById('f_profession').value.trim();
  } else if(step===2){
    w.bio = document.getElementById('bioEditor').innerHTML;
  } else if(step===7){
    w.social.instagram = document.getElementById('s_instagram').value.trim();
    w.social.facebook = document.getElementById('s_facebook').value.trim();
    w.social.twitter = document.getElementById('s_twitter').value.trim();
    w.social.whatsapp = document.getElementById('s_whatsapp').value.trim();
    w.social.email = document.getElementById('s_email').value.trim();
  }
  // repeater steps (3,4,5,6) sync live via input listeners, nothing to collect here
}
function bindWizardEvents(step){
  const back = document.getElementById('wizBack');
  const next = document.getElementById('wizNext');
  const save = document.getElementById('wizSave');
  if(back) back.onclick = ()=>{ collectStepIntoState(step); go(`#/wizard?step=${step-1}`); };
  if(next) next.onclick = ()=>{
    if(step===1){
      const name=document.getElementById('f_fullName').value.trim();
      const prof=document.getElementById('f_profession').value.trim();
      if(!name || !prof){ toast('Please fill in full name and profession.'); return; }
    }
    collectStepIntoState(step);
    go(`#/wizard?step=${step+1}`);
  };
  if(save) save.onclick = async ()=>{
    collectStepIntoState(step);
    await persistWizardProfile();
  };

  if(step===1){
    const btn=document.getElementById('photoBtn'), input=document.getElementById('photoInput');
    if(btn) btn.onclick = ()=>input.click();
    if(input) input.onchange = async ()=>{
      if(input.files && input.files[0]){
        const dataUrl = await resizeImage(input.files[0]);
        wizardState.photo = dataUrl;
        document.getElementById('photoPreviewImg').outerHTML = `<img src="${dataUrl}" id="photoPreviewImg">`;
      }
    };
  }
  if(step===2){
    document.querySelectorAll('.rt-toolbar button').forEach(b=>{
      b.onclick = ()=>{
        document.getElementById('bioEditor').focus();
        document.execCommand(b.dataset.cmd, false, b.dataset.val||null);
      };
    });
  }
  if(step>=3 && step<=6){
    bindRepeater(step);
  }
}
function repeaterConfigForStep(step){
  if(step===3) return [{kind:'education', listId:'repList', addId:'addRow'}];
  if(step===4) return [{kind:'career', listId:'repList', addId:'addRow'}];
  if(step===5) return [{kind:'achievements', listId:'repList', addId:'addRow'}];
  if(step===6) return [{kind:'awards', listId:'repListAwards', addId:'addRowAwards'},{kind:'records', listId:'repListRecords', addId:'addRowRecords'}];
  return [];
}
const FIELD_DEFS = {
  education:[{key:'degree'},{key:'institution'},{key:'year'}],
  career:[{key:'role'},{key:'org'},{key:'start'},{key:'end'},{key:'desc'}],
  achievements:[{key:'title'},{key:'year'},{key:'desc'}],
  awards:[{key:'title'},{key:'year'},{key:'desc'}],
  records:[{key:'title'},{key:'year'},{key:'desc'}]
};
function bindRepeater(step){
  const configs = repeaterConfigForStep(step);
  configs.forEach(cfg=>{
    const rerender = ()=>{
      const wrap = document.getElementById(cfg.listId);
      const fieldsMeta = {
        education:[{key:'degree',label:'Degree / qualification'},{key:'institution',label:'Institution'},{key:'year',label:'Year'}],
        career:[{key:'role',label:'Role / title'},{key:'org',label:'Organization'},{key:'start',label:'Start year'},{key:'end',label:'End year'},{key:'desc',label:'Description',type:'textarea'}],
        achievements:[{key:'title',label:'Achievement'},{key:'year',label:'Year'},{key:'desc',label:'Description',type:'textarea'}],
        awards:[{key:'title',label:'Award'},{key:'year',label:'Year'},{key:'desc',label:'Description',type:'textarea'}],
        records:[{key:'title',label:'Record'},{key:'year',label:'Year'},{key:'desc',label:'Description',type:'textarea'}]
      }[cfg.kind];
      wrap.innerHTML = wizardState[cfg.kind].map((v,i)=>repeaterRow(fieldsMeta, v, i, cfg.kind)).join('');
      wrap.querySelectorAll('[data-field]').forEach(inp=>{
        inp.oninput = ()=>{
          const [kind, idx, key] = inp.dataset.field.split('.');
          wizardState[kind][idx][key] = inp.value;
        };
      });
      wrap.querySelectorAll('[data-remove]').forEach(btn=>{
        btn.onclick = ()=>{ wizardState[cfg.kind].splice(parseInt(btn.dataset.remove,10),1); rerender(); };
      });
    };
    document.getElementById(cfg.addId).onclick = ()=>{
      wizardState[cfg.kind].push({});
      rerender();
    };
    rerender();
  });
}
async function persistWizardProfile(){
  const u = currentUser();
  const w = wizardState;
  if(!w.fullName || !w.profession){ toast('Please complete the required fields.'); go('#/wizard?step=1'); return; }
  let p = userProfile(u.id);
  if(p){
    Object.assign(p, { fullName:w.fullName, photo:w.photo, birthdate:w.birthdate, profession:w.profession, bio:w.bio,
      education:w.education, career:w.career, achievements:w.achievements, awards:w.awards, records:w.records, social:w.social });
  } else {
    p = { id:uid(), ownerId:u.id, fullName:w.fullName, photo:w.photo, birthdate:w.birthdate, profession:w.profession, bio:w.bio,
      education:w.education, career:w.career, achievements:w.achievements, awards:w.awards, records:w.records, social:w.social,
      verification:'none', published:false, views:0, likes:0, publishDate:null, createdAt:new Date().toISOString() };
    DB.profiles.push(p);
  }
  await saveProfiles();
  wizardState = null;
  toast('Profile saved.');
  go('#/dashboard');
}

        <a class="share-btn" href="${p.social.email?('mailto:'+p.social.email):'#'}" title="Email">${ICON.mail}</a>

      ${p.career.length? `<div class="block-title">Career</div><div class="timeline">${p.career.map(c=>`<div class="timeline-item"><div class="ti-title">${esc(c.role)}, ${esc(c.org)}</div><div class="ti-meta">${esc(c.start)} — ${esc(c.end)}</div><div class="ti-desc">${esc(c.desc)}</div></div>`).join('')}</div>`:''}

      ${p.achievements.length? `<div class="block-title">Achievements</div><div class="timeline">${p.achievements.map(a=>`<div class="timeline-item"><div class="ti-title">${esc(a.title)}</div><div class="ti-meta">${esc(a.year)}</div><div class="ti-desc">${esc(a.desc)}</div></div>`).join('')}</div>`:''}

      ${p.awards.length? `<div class="block-title">Awards</div><div class="timeline">${p.awards.map(a=>`<div class="timeline-item"><div class="ti-title">${esc(a.title)}</div><div class="ti-meta">${esc(a.year)}</div><div class="ti-desc">${esc(a.desc)}</div></div>`).join('')}</div>`:''}

      ${p.records.length? `<div class="block-title">Records</div><div class="timeline">${p.records.map(r=>`<div class="timeline-item"><div class="ti-title">${esc(r.title)}</div><div class="ti-meta">${esc(r.year)}</div><div class="ti-desc">${esc(r.desc)}</div></div>`).join('')}</div>`:''}

      <div class="block-title">Connect</div>
      <div class="social-row">
        ${p.social.instagram?`<a class="social-chip" href="${esc(p.social.instagram)}" target="_blank">${ICON.insta} Instagram</a>`:''}
        ${p.social.facebook?`<a class="social-chip" href="${esc(p.social.facebook)}" target="_blank">${ICON.fb} Facebook</a>`:''}
        ${p.social.twitter?`<a class="social-chip" href="${esc(p.social.twitter)}" target="_blank">${ICON.x} X</a>`:''}
        ${p.social.whatsapp?`<a class="social-chip" href="${esc(p.social.whatsapp)}" target="_blank">${ICON.wa} WhatsApp</a>`:''}
        ${p.social.email?`<a class="social-chip" href="mailto:${esc(p.social.email)}">${ICON.mail} Email</a>`:''}
      </div>
    </div>
  </div>
  <div style="height:70px;"></div>`;
}

/* ================= VERIFY / PAYMENT ================= */
const PLANS = {
  normal:{ name:'Normal Verification', price:2500, tier:'normal', color:'var(--pine)', bg:'var(--pine-soft)',
    features:['Verified check badge','Appears in search results','Basic profile analytics'] },
  blue:{ name:'Blue Verification', price:5000, tier:'blue', color:'var(--azure)', bg:'var(--azure-soft)',
    features:['Blue check badge','Priority placement in listings','Advanced analytics','Faster review (24h)'] },
  vip:{ name:'VIP Gold Verification', price:10000, tier:'vip', color:'var(--gold)', bg:'var(--gold-soft)',
    features:['Gold crown badge','Featured on homepage','Dedicated review specialist','Premium support'] }
};
function pageVerify(query){
  const u = currentUser();
  const p = userProfile(u.id);
  if(!p){ go('#/wizard?step=1'); return ''; }
  const stage = query.stage || 'plans';
  if(stage==='processing'){
    const plan = PLANS[query.plan] || PLANS.normal;
    return `
    <section class="section"><div class="container pay-screen">
      <div class="spinner"></div>
      <h3>Processing your payment…</h3>
      <p style="font-size:13.5px;">Confirming ₹${plan.price.toLocaleString('en-IN')} for ${plan.name}. Do not close this window.</p>
      <div class="pill-note">Payment gateway placeholder — connect Razorpay / Stripe here</div>
    </div></section>`;
  }
  if(stage==='success'){
    const plan = PLANS[query.plan] || PLANS.normal;
    const confetti = Array.from({length:26}).map((_,i)=>{
      const colors=['#BE7F27','#20493F','#2B5A88','#A6791C','#E9C382'];
      const left = Math.random()*100;
      const delay = (Math.random()*0.6).toFixed(2);
      const color = colors[i%colors.length];
      return `<div class="confetti-piece" style="left:${left}%;background:${color};animation-delay:${delay}s;"></div>`;
    }).join('');
    return `
    <section class="section"><div class="container success-screen">
      ${confetti}
      <div class="success-icon">${ICON.checkFill}</div>
      <h2>Verification completed successfully!</h2>
      <p>${plan.name} is now applied to <strong>${esc(p.fullName)}</strong>'s profile. Publish it to make it live on PhoenixPedia.</p>
      <button class="btn btn-primary" id="publishBtn" style="margin-top:10px;">${ICON.bolt} Publish profile</button>
    </div></section>`;
  }
  // plans stage
  return `
  <section class="section"><div class="container">
    <div class="eyebrow">Verification</div>
    <h2 style="margin-bottom:8px;">Get ${esc(p.fullName)}'s profile verified</h2>
    <p style="max-width:560px;margin-bottom:36px;">Choose a verification tier. Your profile publishes automatically right after verification completes.</p>
    <div class="plans-grid">
      ${Object.values(PLANS).map(plan=>`
        <div class="plan-card ${plan.tier==='vip'?'featured':''}">
          ${plan.tier==='vip'?'<div class="plan-tag">Most prestige</div>':''}
          <div class="plan-icon" style="background:${plan.bg};color:${plan.color};">${plan.tier==='vip'?ICON.crown:ICON.checkFill}</div>
          <h3 style="font-size:18px;">${plan.name}</h3>
          <div class="plan-price">₹${plan.price.toLocaleString('en-IN')} <span>one-time</span></div>
          <ul class="plan-features">${plan.features.map(f=>`<li>${ICON.check} ${f}</li>`).join('')}</ul>
          <button class="btn ${plan.tier==='vip'?'btn-primary':'btn-outline'} btn-block" data-pay="${plan.tier}">Pay ₹${plan.price.toLocaleString('en-IN')}</button>
        </div>`).join('')}
    </div>
  </div></section>`;
}

/* ================= PER-PAGE BEHAVIOUR ================= */
function afterRender(root, query, parts){
  if(root===''){
    const form = document.getElementById('homeSearch');
    if(form) form.onsubmit = e=>{ e.preventDefault(); const q=form.q.value.trim(); go('#/'+(q?`?q=${encodeURIComponent(q)}`:'')); };
  }

  if(root==='login'){
    const form = document.getElementById('loginForm');
    form.onsubmit = async e=>{
      e.preventDefault();
      const username = form.username.value.trim();
      const password = form.password.value;
      const u = DB.users.find(x=>x.username.toLowerCase()===username.toLowerCase() && x.password===password);
      if(!u){
        document.getElementById('loginError').innerHTML = `<div class="error-box">Incorrect username or password.</div>`;
        return;
      }
      DB.session = { userId:u.id };
      await saveSession();
      toast(`Welcome back, ${u.username}.`);
      go('#/dashboard');
    };
  }

  if(root==='register'){
    const form = document.getElementById('registerForm');
    form.onsubmit = async e=>{
      e.preventDefault();
      const username = form.username.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      if(DB.users.find(x=>x.username.toLowerCase()===username.toLowerCase())){
        document.getElementById('regError').innerHTML = `<div class="error-box">That username is already taken.</div>`;
        return;
      }
      const newUser = { id:uid(), username, email, password, isFounder:false, createdAt:new Date().toISOString() };
      DB.users.push(newUser);
      await saveUsers();
      DB.session = { userId:newUser.id };
      await saveSession();
      toast('Account created!');
      wizardState = null;
      go('#/wizard?step=1');
    };
  }

  if(root==='dashboard'){
    document.querySelectorAll('[data-action]').forEach(btn=>{
      const action = btn.dataset.action;
      if(action==='logout') return; // handled globally
      btn.onclick = (e)=>{
        e.preventDefault();
        const u = currentUser(); const p = userProfile(u.id);
        if(action==='create'){ wizardState=null; go('#/wizard?step=1'); }
        if(action==='edit'){ wizardState=null; go('#/wizard?step=1'); }
        if(action==='preview'){ if(p) go('#/profile/'+p.id); }
        if(action==='verify'){ if(p) go('#/verify'); }
        if(action==='delete'){
          if(!p) return;
          if(confirm('Delete your profile permanently? This cannot be undone.')){
            DB.profiles = DB.profiles.filter(x=>x.id!==p.id);
            saveProfiles().then(()=>{ toast('Profile deleted.'); render(); });
          }
        }
      };
    });
  }

  if(root==='wizard'){
    const step = Math.min(Math.max(parseInt(query.step||'1',10),1), WIZ_STEPS.length);
    bindWizardEvents(step);
  }

  if(root==='profile'){
    const p = DB.profiles.find(x=>x.id===parts[1]);
    if(p){
      bumpViews(p);
      const likeBtn = document.getElementById('likeBtn');
      if(likeBtn){
        (async ()=>{
          const liked = await sGet('pp_liked_'+p.id, false);
          if(liked) likeBtn.classList.add('liked');
        })();
        likeBtn.onclick = async ()=>{
          const liked = await sGet('pp_liked_'+p.id, false);
          if(liked){ toast('You already liked this profile.'); return; }
          p.likes = (p.likes||0)+1;
          await saveProfiles();
          await sSet('pp_liked_'+p.id, true, false);
          document.getElementById('likeCount').textContent = fmtNum(p.likes);
          likeBtn.classList.add('liked');
          toast('Liked!');
        };
      }
    }
  }

  if(root==='verify'){
    const stage = query.stage || 'plans';
    if(stage==='plans'){
      document.querySelectorAll('[data-pay]').forEach(btn=>{
        btn.onclick = ()=>{
          const tier = btn.dataset.pay;
          /* PAY_INTEGRATION_POINT: replace this simulated flow with a real
             Razorpay/Stripe checkout call, then route to ?stage=success on success. */
          go(`#/verify?stage=processing&plan=${tier}`);
          setTimeout(()=>{ go(`#/verify?stage=success&plan=${tier}`); }, 1800);
        };
      });
    }
    if(stage==='success'){
      const btn = document.getElementById('publishBtn');
      btn.onclick = async ()=>{
        const u = currentUser(); const p = userProfile(u.id);
        p.verification = query.plan || 'normal';
        p.published = true;
        p.publishDate = new Date().toISOString();
        await saveProfiles();
        toast('Profile published! It is now live on PhoenixPedia.');
        go('#/profile/'+p.id);
      };
    }
  }

  if(root==='about'){
    const toggle = document.getElementById('toggleAboutEdit');
    if(toggle){
      toggle.onclick = ()=>{
        const view = document.getElementById('aboutView');
        const edit = document.getElementById('aboutEdit');
        if(edit.style.display==='none'){
          edit.innerHTML = aboutEditForm();
          bindAboutEditForm();
          view.style.display='none'; edit.style.display='block';
          toggle.textContent = 'Close editor';
        } else {
          edit.style.display='none'; view.style.display='block';
          toggle.innerHTML = `${ICON.edit} Edit about page`;
        }
      };
    }
  }

  if(root==='contact'){
    const form = document.getElementById('contactForm');
    form.onsubmit = e=>{
      e.preventDefault();
      /* This is a front-end placeholder: wire to an email service or backend endpoint. */
      toast('Message sent — the founder will reply soon.');
      form.reset();
    };
  }
}

/* ---------------- About edit form (founder-only) ---------------- */
function aboutEditForm(){
  const f = DB.founder;
  return `
  <div class="editable-note">${ICON.shield} Founder mode — changes save to the live About page.</div>
  <div class="field"><label>Name</label><input class="input" id="ea_name" value="${esc(f.name)}"></div>
  <div class="field"><label>Tagline</label><input class="input" id="ea_tagline" value="${esc(f.tagline)}"></div>
  <div class="field"><label>Birthdate</label><input class="input" type="date" id="ea_birthdate" value="${esc(f.birthdate)}"></div>
  <div class="field"><label>Biography</label><textarea class="textarea" id="ea_bio" rows="5">${esc(f.bio)}</textarea></div>
  <div class="field"><label>Contact email</label><input class="input" id="ea_email" value="${esc(f.contact.email)}"></div>
  <div class="field"><label>Contact phone</label><input class="input" id="ea_phone" value="${esc(f.contact.phone)}"></div>
  <div class="field"><label>Office address</label><input class="input" id="ea_address" value="${esc(f.contact.address)}"></div>
  <div style="display:flex;gap:10px;margin-top:20px;">
    <button class="btn btn-primary" id="ea_save">${ICON.check} Save changes</button>
  </div>
  <p style="font-size:12px;margin-top:14px;">Education, career, awards, achievements, records and timeline can be extended directly in the seed data for deeper customization.</p>`;
}
function bindAboutEditForm(){
  document.getElementById('ea_save').onclick = async ()=>{
    const f = DB.founder;
    f.name = document.getElementById('ea_name').value.trim();
    f.tagline = document.getElementById('ea_tagline').value.trim();
    f.birthdate = document.getElementById('ea_birthdate').value;
    f.bio = document.getElementById('ea_bio').value.trim();
    f.contact.email = document.getElementById('ea_email').value.trim();
    f.contact.phone = document.getElementById('ea_phone').value.trim();
    f.contact.address = document.getElementById('ea_address').value.trim();
    await saveFounder();
    toast('About page updated.');
    render();
  };
}

boot();
